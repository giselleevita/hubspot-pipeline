[tool.pytest.ini_options]
# The tests import from extract/ and scripts/, which are packages at the
# repository root rather than an installed distribution. Without this, a bare
# `pytest` fails to collect while `python -m pytest` succeeds, because only the
# module form puts the working directory on sys.path. Setting it here means
# both work, in CI and for anyone who clones the repository.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
