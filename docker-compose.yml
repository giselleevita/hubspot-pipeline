services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pipeline
      POSTGRES_PASSWORD: pipeline
      POSTGRES_DB: hubspot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeline -d hubspot"]
      interval: 3s
      timeout: 3s
      retries: 20

  pipeline:
    build: .
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["run"]

volumes:
  postgres_data:
